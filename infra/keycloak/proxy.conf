# Keycloak's public face (docs/adr/0055): an nginx beside Keycloak in its container app, the only port its ingress
# reaches. Every path goes through to Keycloak but the admin console and admin REST API (/admin), which answer only
# callers inside the environment (the host's user admin and staff reader) and the addresses the deployment lists
# (KEYCLOAK_ADMIN_ADDRESSES, infra/README.md). infra/resources.bicep puts those addresses where the marker is.
server {
    listen 8000;
    server_name _;
    server_tokens off;

    # The Container Apps ingress is the only peer, and appends the caller's address to X-Forwarded-For; an address
    # inside a private range can only be one the environment added, so the caller is the last address outside them.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # The realm's JSON on creation (infra/keycloak/create-realm.sh) and Keycloak's large cookies and headers.
    client_max_body_size 10m;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Keycloak reads the ingress's forwarded headers (KC_PROXY_HEADERS=xforwarded): pass them on as they arrived.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;

    location ^~ /admin {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        # KEYCLOAK_ADMIN_ADDRESSES
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
