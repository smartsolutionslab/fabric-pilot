# Dependabot keeps every package ecosystem this project has current (docs/adr). Minor and patch updates come
# grouped in one pull request per ecosystem; a major update comes on its own, since it may need code changes.
# Commits are chore(deps), so the project's commit check accepts them.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    # Versions the generator holds back on purpose: a newer one fails restore. Each says why and which issue lifts it.
    ignore:
      # EF Core stays at 11.0.0-rc.3.26522.148, the build Npgsql.EntityFrameworkCore.PostgreSQL 11.0.0-rc.3 requires
      # exactly, so a newer one fails restore. Lifted by smartsolutionslab/software-fabric#551 (Npgsql 11.0.0), which
      # removes these entries.
      - dependency-name: Microsoft.EntityFrameworkCore
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: Microsoft.EntityFrameworkCore.Design
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: Microsoft.EntityFrameworkCore.Relational
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

      # Microsoft.CodeAnalysis.CSharp stays at 5.0.0: Wolverine's runtime compiler requires exactly Roslyn 5.0.0, so a
      # newer one fails restore (NU1608). Lifted by smartsolutionslab/software-fabric#615, which removes this entry.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

      # PDFsharp stays at 6.2.4, the last release published under MIT: 6.5.0 and the 7.0 previews are AGPL-3.0-only,
      # and the owner chose PDFsharp under MIT for invoice PDFs (issue #10). Moving to a later release is the owner's
      # decision, not an update.
      - dependency-name: PDFsharp
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

