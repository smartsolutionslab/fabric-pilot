name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per workflow and ref. A newer push to a pull request makes the run before it pointless, so it is cancelled;
# a run on main is never cancelled while it runs (one that is still waiting gives way to the newer push's).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # The AppHost uses the Aspire CLI bundle (DCP and dashboard); set it up before anything builds the AppHost.
      - run: dnx --yes aspire.cli@13.6.5 -- setup --install-path "$HOME/.aspire"
      - name: Check formatting
        run: bash .github/scripts/format.sh --verify-no-changes
      - run: dotnet build build.proj -c Release
      # The integration tests start the whole application, the web app included.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test
        run: bash .github/scripts/test.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The lockfile is committed
        run: test -f web/pnpm-lock.yaml || { echo "::error::web/pnpm-lock.yaml is missing. Run pnpm install in web/ and commit it (README, First steps)."; exit 1; }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm test
        working-directory: web
      # Formatting is Prettier's (.prettierrc.json); run pnpm format in web/app to fix what this reports.
      - run: pnpm format:check
        working-directory: web/app

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dnx --yes aspire.cli@13.6.5 -- setup --install-path "$HOME/.aspire"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web/app
      - run: bash .github/scripts/e2e.sh

